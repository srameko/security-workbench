name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: File exists
        run: |
          test -f secbench.html

      - name: File size check
        run: |
          size=$(wc -c < secbench.html)
          echo "Size: ${size} bytes ($(( size / 1024 )) KB)"
          if [ "$size" -gt 524288 ]; then
            echo "::warning file=secbench.html::File exceeds 512 KB"
          fi

      - name: HTML structure
        run: |
          fail=0
          check() {
            if grep -q "$1" secbench.html; then
              echo "OK  $2"
            else
              echo "FAIL $2"
              fail=1
            fi
          }
          check '<!DOCTYPE html>'          'DOCTYPE'
          check 'charset="UTF-8"'          'charset UTF-8'
          check 'viewport'                 'viewport meta'
          check '<title>SecBench</title>'  'title tag'
          check 'react.production.min.js'  'React CDN'
          check 'ReactDOM.createRoot'      'ReactDOM.createRoot'
          check 'd3.min.js'                'D3 CDN'
          check 'localStorage'             'localStorage usage'
          exit $fail

      - name: CDN availability
        run: |
          fail=0
          for url in \
            "https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" \
            "https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" \
            "https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js" \
            "https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"
          do
            if curl -sf --max-time 15 --head "$url" -o /dev/null; then
              echo "OK  $url"
            else
              echo "FAIL $url"
              fail=1
            fi
          done
          exit $fail

      - name: Security checks
        run: |
          warn=0

          count=$(grep -cP '\.innerHTML\s*=' secbench.html || true)
          if [ "$count" -gt 0 ]; then
            echo "::warning file=secbench.html::innerHTML assignment (${count}x) — verify no user data flows in"
            warn=1
          fi

          count=$(grep -c 'dangerouslySetInnerHTML' secbench.html || true)
          if [ "$count" -gt 0 ]; then
            echo "::warning file=secbench.html::dangerouslySetInnerHTML (${count}x) — verify sanitization"
            warn=1
          fi

          if grep -qP 'anthropicKey:\s*"sk-ant-[^"]{8,}"' secbench.html; then
            echo "::error file=secbench.html::Hardcoded Anthropic API key detected"
            exit 1
          fi

          if grep -qP 'openaiKey:\s*"sk-[^"]{8,}"' secbench.html; then
            echo "::error file=secbench.html::Hardcoded OpenAI API key detected"
            exit 1
          fi

          if [ $warn -eq 0 ]; then
            echo "OK  no security issues"
          fi
